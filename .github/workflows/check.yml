name: Check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ShellCheck
        run: shellcheck -S warning bin/phonelink install.sh uninstall.sh tests/*.sh

      - name: Bash syntax
        run: for f in bin/phonelink install.sh uninstall.sh tests/*.sh; do bash -n "$f"; done

      - name: Plugin JSON
        run: jq empty shell/phonelink.panel/manifest.json shell/phonelink.panel/i18n/*.json

      - name: Lua syntax
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.4
          luac5.4 -p hypr/phonelink.lua

      # Omarchy drops whole-line // comments and trailing commas, then parses
      # the menu file as JSON (MenuModel.js). The entries go inside its braces.
      - name: Menu entries
        run: |
          { echo '{'; cat omarchy/menu.jsonc; echo '}'; } |
            sed -E '/^\s*\/\//d' | sed -zE 's/,(\s*[]}])/\1/g' | jq -e 'has("phone")' >/dev/null

      - name: Translations
        run: tests/i18n.sh

      - name: Installer edits
        run: tests/edits.sh
