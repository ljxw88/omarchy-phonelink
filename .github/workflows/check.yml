name: Check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ShellCheck
        run: shellcheck -S warning bin/phonelink install.sh uninstall.sh

      - name: Bash syntax
        run: for f in bin/phonelink install.sh uninstall.sh; do bash -n "$f"; done

      - name: Plugin JSON
        run: jq empty shell/phonelink.panel/manifest.json shell/phonelink.panel/i18n/*.json
